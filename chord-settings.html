<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chord Settings | bias</title>
    <meta name="description" content="Chord Classroomの設定画面モックアップ。">
    <link rel="icon" href="assets/images/mark.png">
    <link rel="stylesheet" href="assets/styles.css?v=tone-room">
  </head>
  <body class="chord-page settings-page">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="bias entrance">
        <img src="assets/images/logo-bias.png" alt="">
        <span class="brand-word">bias</span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html">ENTRANCE</a>
        <a href="chord-classroom.html">CHORD</a>
        <a href="tone-classroom.html">TONE</a>
        <a href="chord-settings.html">SETTINGS</a>
        <a href="label.html#contact">CONTACT</a>
      </nav>
    </header>

    <main class="settings-shell">
      <section class="settings-hero">
        <div>
          <p class="eyebrow">Control Room</p>
          <h1>Chord <span>Classroom</span><span>Settings</span></h1>
          <p class="lead">画面はやさしく、音は深く。</p>
        </div>
        <aside class="settings-status" aria-label="Current preset">
          <span class="panel-label">Preset</span>
          <strong>Kids Ghost</strong>
          <p>やさしい音量、濃いめの残像、白鍵中心。</p>
        </aside>
      </section>

      <section class="settings-grid" aria-label="Chord Classroom settings">
        <article class="settings-card">
          <div class="settings-card-head">
            <div>
              <p class="eyebrow">Lesson</p>
              <h2>子どもモード</h2>
            </div>
            <label class="switch">
              <input type="checkbox" checked>
              <span></span>
            </label>
          </div>
          <label class="setting-row">
            <span>
              <strong>説明文</strong>
              <small>むずかしい理論名を減らす</small>
            </span>
            <select>
              <option>やさしい</option>
              <option>ふつう</option>
              <option>音楽理論</option>
            </select>
          </label>
          <label class="setting-row">
            <span>
              <strong>クイズ</strong>
              <small>耳でMajor/Minorを当てる</small>
            </span>
            <select>
              <option>2択</option>
              <option>3択</option>
              <option>オフ</option>
            </select>
          </label>
        </article>

        <article class="settings-card">
          <div class="settings-card-head">
            <div>
              <p class="eyebrow">Sound</p>
              <h2>音色</h2>
            </div>
            <button class="mini-button" type="button">試聴</button>
          </div>
          <label class="setting-row">
            <span>
              <strong>波形</strong>
              <small>ブラウザ内蔵シンセ</small>
            </span>
            <select>
              <option>Triangle</option>
              <option>Sine</option>
              <option>Square</option>
            </select>
          </label>
          <label class="slider-row">
            <span>音量</span>
            <input type="range" min="0" max="100" value="42">
          </label>
          <label class="slider-row">
            <span>余韻</span>
            <input type="range" min="0" max="100" value="68">
          </label>
        </article>

        <article class="settings-card">
          <div class="settings-card-head">
            <div>
              <p class="eyebrow">Ghost</p>
              <h2>残像</h2>
            </div>
            <label class="switch">
              <input type="checkbox" checked>
              <span></span>
            </label>
          </div>
          <label class="slider-row">
            <span>濃さ</span>
            <input type="range" min="0" max="100" value="72">
          </label>
          <label class="slider-row">
            <span>漂う時間</span>
            <input type="range" min="0" max="100" value="58">
          </label>
          <div class="ghost-preview" aria-hidden="true">
            <span>C</span>
            <span>E</span>
            <span>G</span>
          </div>
        </article>

        <article class="settings-card">
          <div class="settings-card-head">
            <div>
              <p class="eyebrow">Chord Set</p>
              <h2>コード範囲</h2>
            </div>
          </div>
          <div class="check-grid">
            <label><input type="checkbox" checked> Major</label>
            <label><input type="checkbox" checked> Minor</label>
            <label><input type="checkbox" checked> Maj7</label>
            <label><input type="checkbox" checked> Min7</label>
            <label><input type="checkbox" checked> Sus4</label>
            <label><input type="checkbox" checked> Add9</label>
            <label><input type="checkbox"> 7th</label>
            <label><input type="checkbox"> Dim</label>
          </div>
        </article>

        <article class="settings-card wide-card">
          <div class="settings-card-head">
            <div>
              <p class="eyebrow">Output</p>
              <h2>出力</h2>
            </div>
            <span class="status-pill">Web Audio</span>
          </div>
          <div class="output-list">
            <label>
              <input type="radio" name="output" checked>
              <span>
                <strong>ブラウザで鳴らす</strong>
                <small>すぐ遊べる。インストールなし。</small>
              </span>
            </label>
            <label>
              <input type="radio" name="output">
              <span>
                <strong>Web MIDIへ送る</strong>
                <small>DAWや外部音源につなぐ予定地。</small>
              </span>
            </label>
          </div>
        </article>
      </section>

      <div class="settings-actions">
        <a class="text-link" href="chord-classroom.html">教室へ戻る</a>
        <button class="action-button" type="button">設定を保存</button>
      </div>
    </main>
  </body>
</html>
