<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab Settings | bias</title>
    <meta name="description" content="Chord Labの設定画面モックアップ。">
    <link rel="icon" href="assets/images/mark.png">
    <link rel="stylesheet" href="assets/styles.css?v=ensemble-tools">
  </head>
  <body class="chord-page settings-page">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="bias entrance">
        <img src="assets/images/logo-bias.png" alt="">
        <span class="brand-word">bias</span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html">ENTRANCE</a>
        <a href="chord-classroom.html">LAB</a>
        <a href="tone-classroom.html">TONE</a>
        <a href="chord-settings.html">SETTINGS</a>
        <a href="label.html#contact">CONTACT</a>
      </nav>
    </header>

    <main class="settings-shell">
      <section class="settings-hero">
        <div>
          <p class="eyebrow">Control Room</p>
          <h1>Chord <span>Lab</span><span>Settings</span></h1>
          <p class="lead">画面はやさしく、音は深く。</p>
        </div>
      </section>

      <section class="settings-grid" aria-label="Chord Lab settings">
        <article class="settings-card">
          <div class="settings-card-head">
            <div>
              <p class="eyebrow">Guide</p>
              <h2>ファミリー設定</h2>
            </div>
            <label class="switch">
              <input type="checkbox" checked>
              <span></span>
            </label>
          </div>
          <label class="setting-row">
            <span>
              <strong>説明文</strong>
              <small>むずかしい理論名を控える</small>
            </span>
            <select>
              <option>やさしい</option>
              <option>ふつう</option>
              <option>音楽理論</option>
            </select>
          </label>
          <label class="setting-row">
            <span>
              <strong>クイズ</strong>
              <small>耳でMajor/Minorを当てる</small>
            </span>
            <select>
              <option>2択</option>
              <option>3択</option>
              <option>オフ</option>
            </select>
          </label>
        </article>

        <article class="settings-card">
          <div class="settings-card-head">
            <div>
              <p class="eyebrow">Sound</p>
              <h2>音色</h2>
            </div>
            <a class="mini-button" href="tone-classroom.html">試聴</a>
          </div>
          <label class="setting-row">
            <span>
              <strong>波形</strong>
              <small>ブラウザ内蔵シンセ</small>
            </span>
            <select>
              <option>Triangle</option>
              <option>Sine</option>
              <option>Square</option>
            </select>
          </label>
          <label class="slider-row">
            <span>音量</span>
            <input type="range" min="0" max="100" value="42">
          </label>
          <label class="slider-row">
            <span>余韻</span>
            <input type="range" min="0" max="100" value="68">
          </label>
        </article>

        <article class="settings-card">
          <div class="settings-card-head">
            <div>
              <p class="eyebrow">Motion</p>
              <h2>残像</h2>
            </div>
            <label class="switch">
              <input type="checkbox" checked>
              <span></span>
            </label>
          </div>
          <label class="slider-row">
            <span>濃さ</span>
            <input type="range" min="0" max="100" value="72">
          </label>
          <label class="slider-row">
            <span>漂う時間</span>
            <input type="range" min="0" max="100" value="58">
          </label>
          <div class="ghost-preview" aria-hidden="true">
            <span>C</span>
            <span>E</span>
            <span>G</span>
          </div>
        </article>

        <article class="settings-card">
          <div class="settings-card-head">
            <div>
              <p class="eyebrow">Chord Set</p>
              <h2>コード範囲</h2>
            </div>
          </div>
          <div class="check-grid">
            <label><input type="checkbox" checked> Major</label>
            <label><input type="checkbox" checked> Minor</label>
            <label><input type="checkbox" checked> Maj7</label>
            <label><input type="checkbox" checked> Min7</label>
            <label><input type="checkbox" checked> Sus4</label>
            <label><input type="checkbox" checked> Add9</label>
            <label><input type="checkbox"> 7th</label>
            <label><input type="checkbox"> Dim</label>
          </div>
        </article>

        <article class="settings-card wide-card">
          <div class="settings-card-head">
            <div>
              <p class="eyebrow">Output</p>
              <h2>出力</h2>
            </div>
            <span class="status-pill">Web Audio</span>
          </div>
          <div class="output-list">
            <label>
              <input type="radio" name="output" checked>
              <span>
                <strong>ブラウザで鳴らす</strong>
                <small>すぐ遊べる。インストールなし。</small>
              </span>
            </label>
            <label>
              <input type="radio" name="output">
              <span>
                <strong>Web MIDIへ送る</strong>
                <small>DAWや外部音源につなぐ予定地。</small>
              </span>
            </label>
          </div>
        </article>
      </section>

      <div class="settings-actions">
        <p class="settings-save-status" id="settingsSaveStatus" aria-live="polite"></p>
        <a class="text-link" href="chord-classroom.html">ラボへ戻る</a>
        <button class="action-button" id="saveSettings" type="button">設定を保存</button>
      </div>
    </main>
    <script>
      (() => {
        const storageKey = "bias-lab-settings-v1";
        const saveButton = document.querySelector("#saveSettings");
        const saveStatus = document.querySelector("#settingsSaveStatus");
        const settingsShell = document.querySelector(".settings-shell");
        let resetTimer;

        const getText = (element) => element?.textContent.trim() || "";

        const collectSettings = () => {
          const selects = [...document.querySelectorAll(".setting-row select")];
          const sliders = [...document.querySelectorAll(".slider-row input")];
          const switches = [...document.querySelectorAll(".switch input")];
          return {
            savedAt: new Date().toISOString(),
            familyGuide: switches[0]?.checked ?? true,
            ghostEnabled: switches[1]?.checked ?? true,
            lessonText: selects[0]?.value || "やさしい",
            quiz: selects[1]?.value || "2択",
            waveform: selects[2]?.value || "Triangle",
            volume: sliders[0]?.value || "42",
            release: sliders[1]?.value || "68",
            ghostDensity: sliders[2]?.value || "72",
            ghostTime: sliders[3]?.value || "58",
            chords: [...document.querySelectorAll(".check-grid label")].map((label) => ({
              name: getText(label).replace(/\s+/g, " "),
              enabled: label.querySelector("input")?.checked ?? false,
            })),
            output: getText(document.querySelector("input[name='output']:checked")?.closest("label")),
          };
        };

        const saveLocally = () => {
          try {
            localStorage.setItem(storageKey, JSON.stringify(collectSettings()));
          } catch (error) {
            return false;
          }
          return true;
        };

        const showSaved = (isStored) => {
          window.clearTimeout(resetTimer);
          saveButton.classList.remove("is-saving");
          saveButton.classList.add("is-saved");
          saveButton.textContent = "保存しました";
          saveStatus.textContent = isStored
            ? "設定を保存しました。ラボへ戻って試せます。"
            : "設定を反映しました。この環境では次回保存だけ使えません。";
          saveStatus.classList.add("is-saved");
          settingsShell.classList.add("is-saved");

          resetTimer = window.setTimeout(() => {
            saveButton.classList.remove("is-saved");
            saveButton.textContent = "設定を保存";
            settingsShell.classList.remove("is-saved");
          }, 2200);
        };

        saveButton?.addEventListener("click", () => {
          saveButton.classList.add("is-saving");
          saveButton.textContent = "保存中...";
          saveStatus.textContent = "保存しています...";
          saveStatus.classList.remove("is-saved");

          window.setTimeout(() => {
            showSaved(saveLocally());
          }, 280);
        });

        try {
          if (localStorage.getItem(storageKey)) {
            saveStatus.textContent = "前回保存した設定があります。";
          }
        } catch (error) {
          saveStatus.textContent = "";
        }
      })();
    </script>
  </body>
</html>
